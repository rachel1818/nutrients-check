<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nutrient Check{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <nav class="site-nav">
      <a href="/" class="site-logo">NutriCheck</a>
      <div class="site-nav-links">
        <a href="/nutrients" class="btn-nav">All Nutrients</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Data sourced from
      <a href="https://ods.od.nih.gov/" target="_blank" rel="noopener">NIH ODS</a>,
      <a href="https://fdc.nal.usda.gov/" target="_blank" rel="noopener">USDA FoodData Central</a>,
      <a href="https://www.hsph.harvard.edu/nutritionsource/" target="_blank" rel="noopener">Harvard T.H. Chan</a>,
      <a href="https://www.nin.res.in/" target="_blank" rel="noopener">NIN Hyderabad</a>,
      <a href="https://my.clevelandclinic.org/" target="_blank" rel="noopener">Cleveland Clinic</a>, and
      <a href="https://www.mayoclinic.org/" target="_blank" rel="noopener">Mayo Clinic</a>.
    </p>
    <p class="footer-disclaimer-glow">⚠️ This app is for educational purposes only and is not medical advice.</p>
  </footer>

  <script src="/static/main.js?v={{ asset_version }}"></script>
</body>
</html>
